name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build, e.g. v1.0.0"
        required: true
        default: "v1.3.3"

permissions:
  contents: write

jobs:
  test:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src run.py tests
      - name: Validate release version and required assets
        run: >-
          python scripts/validate_release.py --check-assets
          --tag "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
      - name: Run tests
        run: |
          python tests/test_core.py
          python tests/test_help.py
          python tests/test_help_visibility.py
          python tests/test_ui_source.py
          python tests/test_ui_smoke.py
          python tests/test_release_workflow.py

  build-macos-apple-silicon:
    name: Build macOS Apple Silicon
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          uname -m
          python3 -c "import platform; print(platform.machine())"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "QA Evidence Builder" \
            --paths src \
            --icon assets/icons/qa-evidence-builder.icns \
            --add-data "assets/icons/png/icon-256.png:assets/icons/png" \
            --osx-bundle-identifier "com.guidejir.qaevidencebuilder" \
            run.py

          python scripts/stamp_macos_bundle.py "dist/QA Evidence Builder.app"
          codesign --force --deep --sign - "dist/QA Evidence Builder.app"

      - name: Validate and launch-test packaged application
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/validate_release.py --check-assets --macos-app "dist/QA Evidence Builder.app"
          "dist/QA Evidence Builder.app/Contents/MacOS/QA Evidence Builder" > app-startup.log 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat app-startup.log
            echo "Packaged executable exited during startup."
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Verify Apple Silicon architecture
        run: |
          file "dist/QA Evidence Builder.app/Contents/MacOS/QA Evidence Builder"

      - name: Package macOS Apple Silicon app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/QA Evidence Builder.app" \
            "QA-Evidence-Builder-macOS-Apple-Silicon.zip"

      - name: Upload Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-builder-macos-apple-silicon
          path: QA-Evidence-Builder-macOS-Apple-Silicon.zip
          if-no-files-found: error

  build-macos-intel:
    name: Build macOS Intel
    needs: test
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          uname -m
          python3 -c "import platform; print(platform.machine())"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "QA Evidence Builder" \
            --paths src \
            --icon assets/icons/qa-evidence-builder.icns \
            --add-data "assets/icons/png/icon-256.png:assets/icons/png" \
            --osx-bundle-identifier "com.guidejir.qaevidencebuilder" \
            run.py

          python scripts/stamp_macos_bundle.py "dist/QA Evidence Builder.app"
          codesign --force --deep --sign - "dist/QA Evidence Builder.app"

      - name: Validate and launch-test packaged application
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/validate_release.py --check-assets --macos-app "dist/QA Evidence Builder.app"
          "dist/QA Evidence Builder.app/Contents/MacOS/QA Evidence Builder" > app-startup.log 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat app-startup.log
            echo "Packaged executable exited during startup."
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Verify Intel architecture
        run: |
          file "dist/QA Evidence Builder.app/Contents/MacOS/QA Evidence Builder"

      - name: Package macOS Intel app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/QA Evidence Builder.app" \
            "QA-Evidence-Builder-macOS-Intel.zip"

      - name: Upload Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-builder-macos-intel
          path: QA-Evidence-Builder-macOS-Intel.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "QA-Evidence-Builder-Windows" `
            --paths src `
            --icon assets/icons/qa-evidence-builder.ico `
            --version-file packaging/windows_version_info.txt `
            --add-data "assets/icons/png/icon-256.png:assets/icons/png" `
            run.py

      - name: Launch-test Windows executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $executable = Resolve-Path "dist/QA-Evidence-Builder-Windows.exe"
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Packaged executable exited during startup with code $($process.ExitCode)."
          }
          taskkill /PID $process.Id /T /F | Out-Null

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-builder-windows
          path: dist/QA-Evidence-Builder-Windows.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-macos-apple-silicon
      - build-macos-intel
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-evidence-builder-macos-apple-silicon
          path: release-assets

      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-evidence-builder-macos-intel
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-evidence-builder-windows
          path: release-assets

      - name: Validate release artifacts
        run: |
          python scripts/validate_release.py \
            --tag "${{ steps.version.outputs.tag }}" \
            --artifacts release-assets

      - name: Generate release notes from actual changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > RELEASE_NOTES.md

          {
            echo
            echo "## Downloads"
            echo
            echo "### macOS"
            echo
            echo "- **Apple Silicon (M1/M2/M3/M4 and newer):** \`QA-Evidence-Builder-macOS-Apple-Silicon.zip\`"
            echo "- **Intel Mac:** \`QA-Evidence-Builder-macOS-Intel.zip\`"
            echo
            echo "Extract the ZIP and open \`QA Evidence Builder.app\`."
            echo
            echo "### Windows"
            echo
            echo "- **Windows:** \`QA-Evidence-Builder-Windows.exe\`"
            echo
            echo "Download and run the executable directly."
            echo
            echo "## Distribution notes"
            echo
            echo "- Processing is local-only."
            echo "- Sensitive-data masking is enabled by default."
            echo "- Raw log export is optional and disabled by default."
            echo "- macOS builds are currently unsigned/not notarized, so Gatekeeper may show a warning."
            echo "- Windows builds are currently unsigned, so SmartScreen may show an unknown publisher warning."
            echo
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes."
          } >> RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          ASSETS=(
            "release-assets/QA-Evidence-Builder-macOS-Apple-Silicon.zip"
            "release-assets/QA-Evidence-Builder-macOS-Intel.zip"
            "release-assets/QA-Evidence-Builder-Windows.exe"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/replacing assets."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "QA Evidence Builder $TAG" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "QA Evidence Builder $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
